# BastionPlayHub 服务器列表配置
#
# 格式说明:
#   name:       主机名 (必填, 用于 c 命令匹配)
#   ip:         内网IP (必填, 实际 SSH 连接地址)
#   public_ip:  公网IP (选填, 仅用于展示, 没有则不写)
#
# 示例:
#   - name: web-prod-01
#     ip: 10.0.1.10
#     public_ip: 203.0.113.10
#
#   - name: db-master
#     ip: 10.0.2.20
#
# 修改后立即生效，无需重启堡垒机。

servers:
  - name: server1
    ip: 192.168.1.101
    public_ip: 1.2.3.4
  - name: server2
    ip: 192.168.1.102
  - name: test1
    ip: 192.168.1.6
    public_ip: 5.6.7.8
  - name: test2
    ip: 192.168.1.66
